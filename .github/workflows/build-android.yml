name: Build Android
run-name: Build Android (${{ inputs.build_type || 'both' }})

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Android build mode'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'release'
          - 'debug'
      publish_prerelease:
        description: 'Rolling pre-release (dev-build)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
  TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}

jobs:
  build-android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Install Dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom release keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "No custom release keystore secret configured. Creating fallback signing key for CI/testing..."
            keytool -genkey -v -keystore android/app/keystore.jks \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=keystore.jks\n" > android/key.properties
          fi

      - name: Build Android Debug APK (arm64-v8a)
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          DART_DEFINES=()
          [ -n "$SIMKL_CLIENT_ID" ] && DART_DEFINES+=(--dart-define="SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID")
          [ -n "$TVDB_API_KEY" ] && DART_DEFINES+=(--dart-define="TVDB_API_KEY=$TVDB_API_KEY")

          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          fi

          mkdir -p dist/debug
          flutter build apk --debug --split-per-abi "${DART_DEFINES[@]}"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk" "dist/debug/argus-android-arm64-v8a-v${VERSION}-debug.apk"

      - name: Build Android Release APK (arm64-v8a)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          DART_DEFINES=()
          [ -n "$SIMKL_CLIENT_ID" ] && DART_DEFINES+=(--dart-define="SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID")
          [ -n "$TVDB_API_KEY" ] && DART_DEFINES+=(--dart-define="TVDB_API_KEY=$TVDB_API_KEY")

          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          fi

          mkdir -p dist/release
          flutter build apk --release --split-per-abi "${DART_DEFINES[@]}"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/release/argus-android-arm64-v8a-v${VERSION}.apk"

      - name: Clean Up Keystore Files
        if: always()
        run: |
          rm -f android/app/keystore.jks android/key.properties
          rm -rf build/app/intermediates

      - name: Upload Release APK Artifact
        if: ${{ (inputs.build_type == 'release' || inputs.build_type == 'both') && hashFiles('dist/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: argus-android-release
          path: dist/release/*.apk

      - name: Upload Debug APK Artifact
        if: ${{ (inputs.build_type == 'debug' || inputs.build_type == 'both') && hashFiles('dist/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: argus-android-debug
          path: dist/debug/*.apk

      - name: Publish APK to Pre-release (dev-build)
        if: ${{ inputs.publish_prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: "Argus Android Dev Build"
          body: ""
          prerelease: true
          make_latest: false
          files: |
            dist/release/*.apk
            dist/debug/*.apk
