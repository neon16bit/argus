name: argus
description: "A media aggregator for indexing and streaming from open directories."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  html: ^0.15.6
  http: ^1.6.0
  flutter_riverpod: ^3.3.2
  package_info_plus: ^10.2.0
  cached_network_image: ^3.4.1
  sqlite3: ^3.3.4
  url_launcher: ^6.3.2
  android_intent_plus: ^6.0.0
  shared_preferences: ^2.5.3
  google_fonts: ^8.1.0
  dynamic_color: ^1.9.0
  flutter_svg: ^2.3.0
  webview_flutter: ^4.14.1
  volume_controller: ^3.7.0
  crypto: ^3.0.7
  
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true
  assets:
    - assets/icons/


flutter_launcher_icons:
  image_path: "assets/icons/argus_icon_dark.png"
  android: true
  ios: trueq
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/argus_icon_dark.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  macos:
    generate: true
    image_path: "assets/icons/argus_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/argus_icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icons/argus_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/argus_icon_dark.png"
  adaptive_icon_monochrome: "assets/icons/argus_icon_white.png"
